name: Test & Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (logic + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -v --junitxml=reports/junit.xml

      - name: Show failures as annotations
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          for tc in E.parse("reports/junit.xml").iter("testcase"):
              for f in tc:
                  if f.tag in ("failure", "error"):
                      msg = ((f.get("message") or "") + " | " + (f.text or "")[-700:]).replace("\n", "%0A")
                      print(f"::error title={tc.get('name')}::{msg}")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/junit.xml

  build:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconsole --onefile --name Flint
          --icon assets/icon.ico
          --add-data "ui;ui"
          --add-data "assets/icon.png;assets"
          --hidden-import pystray._win32
          app.py

      - name: Smoke check
        shell: pwsh
        run: |
          $exe = Get-Item dist/Flint.exe
          "Size: {0:N1} MB" -f ($exe.Length / 1MB)
          if ($exe.Length -lt 5MB) { throw "exe подозрительно маленький" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flint
          path: dist/Flint.exe

      - name: Publish release (only for tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Flint.exe
