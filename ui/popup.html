<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Напоминание</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: block; background: var(--bg); overflow: hidden; }
  .pop {
    position: relative; height: 100vh; padding: 26px 26px 22px; display: flex; flex-direction: column; align-items: center;
    text-align: center; border: 1px solid var(--border-2); border-radius: 0; overflow: hidden;
    background: radial-gradient(420px 260px at 50% -40px, rgba(94, 107, 255, .35), transparent 70%),
      linear-gradient(180deg, var(--card-2), var(--card));
  }
  .pop .close { position: absolute; top: 10px; right: 10px; }
  .pop .logo { width: 64px; height: 64px; border-radius: 20px; margin: 6px 0 14px; animation: spark .9s cubic-bezier(.3,1.6,.5,1) .1s both; }
  @keyframes spark { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes ring { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-12deg); } 30% { transform: rotate(10deg); }
    45% { transform: rotate(-8deg); } 60% { transform: rotate(5deg); } 75% { transform: rotate(0); } }
  .pop .kicker { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .pop h1 { font-size: 22px; font-weight: 750; margin: 8px 0 6px; letter-spacing: -.01em; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .pop .when { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .pop .when svg.i { width: 15px; height: 15px; }
  .pop .note { margin-top: 12px; font-size: 13px; color: var(--muted); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pop .tags { justify-content: center; }
  .pop .actions { margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .pop .actions .row { display: flex; gap: 10px; }
  .pop .actions .row .btn { flex: 1; height: 42px; font-size: 13px; white-space: nowrap; padding: 0 10px; }
  /* день рождения */
  .pop.bday { background: radial-gradient(420px 260px at 50% -40px, rgba(245, 196, 81, .35), transparent 70%),
      linear-gradient(180deg, var(--card-2), var(--card)); }
  .pop.bday .kicker { color: #E9B23C; }
  .pop.bday .btn-primary { background: linear-gradient(135deg, #FFD978, #E39A2C); color: #2A1A00; box-shadow: 0 8px 22px rgba(245, 196, 81, .3); }
  .pop .age { margin-top: 10px; font-size: 15px; font-weight: 650; color: #E9B23C; }
  .pop .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .pop .confetti i { position: absolute; top: -10px; width: 6px; height: 10px; border-radius: 2px; animation: fall 3.2s linear infinite; }
  @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translateY(460px) rotate(540deg); opacity: 0; } }
</style>
</head>
<body data-theme="dark">
<svg width="0" height="0" style="position:absolute">
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 8.5a6 6 0 1 1 12 0c0 6.5 2.5 8.5 2.5 8.5h-17S6 15 6 8.5"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="snooze" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M19 3l3 3"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 2.9 1-6.2L3 9.6l6.2-.9z"/></symbol>
  <symbol id="flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="cat-work" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2V7M3 13h18"/></symbol>
  <symbol id="cat-health" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
  <symbol id="cat-personal" viewBox="0 0 24 24"><path d="M12 20s-7-4.3-9-9C1.7 7.5 3.9 4 7.3 4c2 0 3.6 1.1 4.7 2.8C13.1 5.1 14.7 4 16.7 4c3.4 0 5.6 3.5 4.3 7-2 4.7-9 9-9 9z"/></symbol>
  <symbol id="cat-home" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.2 11h11l2-8H6.6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17.5" cy="19" r="1.5"/></symbol>
  <symbol id="cat-growth" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
</svg>

<div class="pop pywebview-drag-region">
  <button class="icon-btn close" data-a="close" title="Закрыть">
    <svg class="i"><use href="#x"/></svg></button>
  <div class="logo"><img src="logo.svg" alt="Flint"></div>
  <div class="kicker">Напоминание</div>
  <h1 id="title">…</h1>
  <div class="when"><svg class="i"><use href="#clock"/></svg><span id="when"></span></div>
  <div class="age" id="age" hidden></div>
  <div class="note" id="note"></div>
  <div class="tags" id="tags"></div>
  <div class="actions">
    <button class="btn btn-primary btn-lg" data-a="open">Открыть</button>
    <div class="row">
      <button class="btn btn-ghost" data-a="snooze"><svg class="i"><use href="#snooze"/></svg><span id="later">Позже</span></button>
      <button class="btn btn-ghost" data-a="done" id="doneBtn"><svg class="i"><use href="#check"/></svg><span>Выполнено</span></button>
    </div>
  </div>
</div>

<script>
"use strict";
const params = new URLSearchParams(location.search);
const DEV = params.has("dev");
const CATS = { work: ["Работа", "#4C8DFF"], health: ["Здоровье", "#2ECDB5"], personal: ["Личное", "#FF5C8A"],
  home: ["Быт", "#3DD68C"], growth: ["Развитие", "#A27BFF"] };
const ready = new Promise((r) => (DEV || window.pywebview?.api) ? r() : addEventListener("pywebviewready", r, { once: true }));

async function call(name) {
  await ready;
  if (!DEV) return window.pywebview.api[name](...[...arguments].slice(1));
  const map = { info: ["popup_info", params.get("id"), params.get("offset") || 0], action: ["popup_action", params.get("id"), arguments[1]] };
  const [m, ...args] = map[name];
  return (await fetch("/api/" + m, { method: "POST", body: JSON.stringify(args) })).json();
}

(async () => {
  const info = await call("info");
  if (!info) return;
  document.body.dataset.theme = info.theme;
  document.getElementById("title").textContent = info.title;
  document.getElementById("when").textContent = info.when;
  document.getElementById("note").textContent = info.note || "";
  document.getElementById("later").textContent = `+${info.snooze} мин`;
  if (info.kind === "birthday") {
    const pop = document.querySelector(".pop");
    pop.classList.add("bday");
    document.querySelector(".kicker").textContent = "🎂 День рождения";
    if (info.age) {
      const a = document.getElementById("age");
      a.hidden = false;
      a.textContent = info.offset === 0 ? `Сегодня исполняется ${info.age} 🎉` : `Исполнится ${info.age}`;
    }
    document.querySelector("#doneBtn span").textContent = "Понятно";
    const colors = ["#F5C451", "#FF5C8A", "#5E6BFF", "#35D49A", "#FF7A1A", "#A27BFF"];
    const conf = document.createElement("div");
    conf.className = "confetti";
    conf.innerHTML = Array.from({ length: 14 }, (_, i) =>
      `<i style="left:${5 + i * 6.7}%;background:${colors[i % 6]};animation-delay:${-(i * .37) % 3.2}s;animation-duration:${2.6 + (i % 4) * .35}s"></i>`).join("");
    pop.prepend(conf);
  }
  const tags = [];
  if (info.category && CATS[info.category]) {
    const [t, c] = CATS[info.category];
    tags.push(`<span class="tag" style="--c:${c}"><svg class="i"><use href="#cat-${info.category}"/></svg>${t}</span>`);
  }
  if (info.important) tags.push(`<span class="tag" style="--c:#FF7A1A"><svg class="i"><use href="#flame"/></svg>Приоритет</span>`);
  document.getElementById("tags").innerHTML = tags.join("");
})();

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (b) call("action", b.dataset.a);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") call("action", "close"); });
</script>
</body>
</html>
